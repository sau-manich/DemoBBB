<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Productos | E-Commerce</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/productos.css">
</head>
<body>

  <div class="top-actions">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Busquemos…" />
    </div>
    <div class="top-icons">
      <i class="fas fa-envelope"></i>
      <i class="fas fa-bell"></i>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active">Tecnología</button>
    <button class="filter-btn">Electrodomésticos</button>
    <button class="filter-btn">Juegos</button>
    <button class="filter-btn">Música</button>
  </div>

  <div class="product-list">
  </div>

  <div class="bottom-nav">
    <i class="fas fa-home active"></i>
    <i class="fas fa-basket-shopping"></i>
    <i class="fas fa-heart"></i>
    <i class="fas fa-user"></i>
  </div>

  <script src="js/productos.js"></script>
</body>
</html>
