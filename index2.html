<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | E-Commerce</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container">
    <h1>Hola de nuevo</h1>
    <p>Inicia sesión para entrar a <strong>BBB</strong> 🛍️</p>
    
    <input type="email" placeholder="Correo electrónico" id="email" />
    <input type="password" placeholder="Contraseña" id="password" />
    
    <div class="forgot-password">¿Olvidaste tu contraseña?</div>
    
    <button class="btn btn-signin" onclick="signIn()">Ingresar</button>
    <button class="btn btn-signup" onclick="signUp()">Registrarse</button>
  </div>

  <script>
    function signIn() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert("Por favor ingresa tu correo y contraseña.");
        return;
      }

      if (email === "admin@gmail.com" && password === "admin") {
        window.location.href = "index3.html";
      } else {
        alert("Credenciales incorrectas. Intenta de nuevo.");
      }
    }

    function signUp() {
      alert("Redirigiendo a pantalla de registro...");
    }
  </script>
</body>
</html>
