<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrito | E-Commerce</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/carrito.css" />
</head>
<body>

  <div class="top-bar">
    <button onclick="window.history.back()"><i class="fas fa-chevron-left"></i></button>
    <div>
      <button id="moreBtn"><i class="fas fa-ellipsis-h"></i></button>
      <div id="popup" class="popup">
        <button onclick="alert('Compartido')">Compartir</button>
        <button onclick="alert('Descargando...')">Descargar</button>
      </div>
    </div>
  </div>

  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <img class="main-image" id="product-img" src="" alt="Imagen del producto">
      </div>
      <div class="swiper-slide">
        <img id="product-img-2" src="" alt="Imagen del producto">
      </div>
      <div class="swiper-slide">
        <img id="product-img-3" src="" alt="Imagen del producto">
      </div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <div class="product-details">
    <div class="info-header">
      <span class="badge">Nuevo producto</span>
      <i id="heart" class="fa-regular fa-heart heart"></i>
    </div>

    <h1 id="product-name"></h1>
    <h3>por Google</h3>
    <p id="product-desc"></p>

    <div class="row">
      <div class="color-box">
        <div class="option-label">Color</div>
        <div class="colors">
          <div class="color" style="background-color: #c06917;"></div>
          <div class="color" style="background-color: #073b66;"></div>
          <div class="color" style="background-color: #108f2b;"></div>
        </div>
      </div>
      <div class="quantity-box">
        <div class="option-label">Cantidad</div>
        <div class="quantity">
          <button onclick="decrease()">-</button>
          <span id="qty">1</span>
          <button onclick="increase()">+</button>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div id="product-price"></div>
      <button class="add-btn" onclick="agregarAlCarrito()">
        <i class="fas fa-shopping-cart" style="margin-right: 8px;"></i>Agregar
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
